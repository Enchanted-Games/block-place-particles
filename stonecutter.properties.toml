[mod]
id = "eg_particle_interactions"
name = "Particle Interactions"
description = """A client side mod that adds particles to various interactions in the game that dont normally have particles.

New in v0.10.2
- Ambient leaf particles now use the particle override specified for that leaf block
    - Spruce leaves now have falling needles, and azalea leaves now have appropriate falling leaf particles
- Honey block particles are no longer bouncy
- Fixed block placement particles sometimes clipping into the block directly above or below
- Fixed bouncy particles taking an extra tick to bounce instead of immediately after colliding something
- Particle collision and interaction with fluids should now be much more accurate
- See the GitHub page for full changelog
"""
group = "games.enchanted"
version_major = "0"
version_minor = "10"
version_patch = "2"
version_suffix = ""
license = "CC BY-NC 4.0"
website_url = "https://particle-interactions.enchanted.games/"
source_url = "https://github.com/Enchanted-Games/block-place-particles"
issue_tracker = "https://github.com/Enchanted-Games/block-place-particles/issues"
icon = "assets/eg_particle_interactions/icon.png"

